; =============================================================================
; ESP32-DIV — M5Stack Tab5 (ESP32-P4) port
;
; Builds ESP32-DIV as a standalone firmware for the M5Stack Tab5, installable as
; a bmorcelli-Launcher "app". The Tab5 is ESP32-P4 + ESP32-C6 (WiFi/BT over
; esp-hosted), a MIPI-DSI 720x1280 panel and ST7123 capacitive touch driven by
; M5GFX (not TFT_eSPI). The TFT_eSPI API is provided by the compat shim in
; boards/tab5/compat, which is placed first on the include path.
;
; The classic ESP32-DIV Arduino sketch lives in ESP32-DIV/. Build with:
;   pio run -e tab5
; =============================================================================
[platformio]
src_dir = ESP32-DIV
default_envs = tab5

[env:tab5]
; pioarduino platform — has ESP32-P4 Arduino + the m5stack-tab5-p4 board.
; (Pinned by URL so a clean/private PLATFORMIO_CORE_DIR resolves it correctly,
;  not the unrelated official espressif32 from the PlatformIO registry.)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = m5stack-tab5-p4
framework = arduino
monitor_speed = 115200

board_build.partitions = boards/tab5/partitions_tab5_16mb.csv

; Stage Launcher-installable artifacts in dist/ after each build (see the script
; and boards/tab5/launcher/INSTALL.md).
extra_scripts = post:boards/tab5/package_launcher.py

build_flags =
	-DBOARD_TAB5
	-I boards/tab5/compat
	-DCORE_DEBUG_LEVEL=3
	-DBOARD_HAS_PSRAM
	; Render the 240x320 UI to an offscreen canvas and scale-blit it to the
	; 720x1280 panel. Set to 0 to draw natively (UI in the top-left corner).
	-DTAB5_SCALED_UI=1
	; To re-measure ST7123 contact area (on-screen area= readout + serial logs,
	; filter bypassed), temporarily add: -DTAB5_TOUCH_DEBUG

	; IDF NimBLE include roots (BLE scan uses the framework's IDF NimBLE C API
	; directly; NimBLE-Arduino won't build on P4). Paths are for the P4 lib bundle.
	-I ${platformio.packages_dir}/framework-arduinoespressif32-libs/esp32p4_es/include/bt/host/nimble/nimble/nimble/host/include
	-I ${platformio.packages_dir}/framework-arduinoespressif32-libs/esp32p4_es/include/bt/host/nimble/nimble/nimble/host/util/include
	-I ${platformio.packages_dir}/framework-arduinoespressif32-libs/esp32p4_es/include/bt/host/nimble/nimble/nimble/include
	-I ${platformio.packages_dir}/framework-arduinoespressif32-libs/esp32p4_es/include/bt/host/nimble/nimble/porting/nimble/include
	-I ${platformio.packages_dir}/framework-arduinoespressif32-libs/esp32p4_es/include/bt/host/nimble/nimble/porting/npl/freertos/include
	-I ${platformio.packages_dir}/framework-arduinoespressif32-libs/esp32p4_es/include/bt/porting/include

lib_deps =
	m5stack/M5GFX
	kosme/arduinoFFT@^1.6.2
	bblanchon/ArduinoJson

; Milestone 1: exclude the hardware-heavy modules that depend on peripherals not
; present on the Tab5 (CC1101 SubGHz, nRF24 ESB, IR, RC522 RFID, GPS UART, and —
; for now — the raw-injection WiFi and Bluetooth Classic/BLE modules). Their
; feature entrypoints are provided by tab5_stubs.cpp. These are re-enabled
; incrementally in later milestones (WiFi scan + BLE scan via the C6 first).
build_src_filter =
	+<*>
	-<subghz.cpp>
	-<ir.cpp>
	-<rfid.cpp>
	-<gps.cpp>
	-<ducky.cpp>
	-<bluetooth.cpp>
