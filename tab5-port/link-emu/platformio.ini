; End-to-end link test firmware for esp-emu: drives the real LinkClient over
; UART1 (bridged to the Python companion_sim via --uart1-tcp). Uses esp32-p4_r3
; (production silicon, boots in the emulator; no USB-CDC so Serial=UART0 which
; the emulator captures for --exit-on). See tools/emulate_link.sh.
[env:link-emu]
platform = espressif32
board = esp32-p4_r3
framework = arduino
build_flags = -std=gnu++17 -DDIVLINK_BAUD=3000000
lib_deps = symlink://${PROJECT_DIR}/../divlink
monitor_speed = 115200
