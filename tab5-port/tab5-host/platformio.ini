; Tab5 host firmware (ESP32-P4). New PlatformIO project on the stock pioarduino
; 55.03.39 platform (Arduino 3.3.9), which already bundles P4 + esp-hosted.
; The plan's custom Launcher bundle is NOT required with this toolchain
; (esp_hosted is present in framework-arduinoespressif32-libs/esp32p4).
[env:tab5-host]
platform = espressif32
board = m5stack-tab5-p4
framework = arduino
; Relies on the stock arduino-esp32 3.3.9 libs (IDF 5.5.4), which DO include
; espressif__esp_hosted for esp32p4 (verified) — the plan's custom Launcher
; bundle is not required with this toolchain. If the shared ~/.platformio cache
; thrashes with a concurrent session, isolate via PLATFORMIO_CORE_DIR.

build_flags =
    -std=gnu++17
    -DUSE_M5GFX=1
    -DBOARD_HAS_PSRAM
    ; link UART (host side) — see PORTING_PLAN.md §7.1 / §16.1
    -DDIVLINK_UART=1
    -DDIVLINK_BAUD=3000000

; Only M5GFX's lgfx must survive LTO/ODR (plan §17.3 MR-3).
lib_ignore = TFT_eSPI, LovyanGFX, GFX Library for Arduino, SensorLib, XPowersLib

lib_deps =
    m5stack/M5Unified@^0.2.17
    m5stack/M5Unit-KEYBOARD
    symlink://${PROJECT_DIR}/../divlink   ; shared link lib ONLY (not sibling projects)

monitor_speed = 115200
board_build.partitions = default_16MB.csv
