; Minimal P4 smoke test: boots on the Tab5 board target and runs the divlink
; self-test on riscv32, printing a sentinel for the emulator's --exit-on.
; Uses the stock pioarduino 55.03.39 platform (Arduino 3.3.9) already installed.
; NOTE: smoke uses the esp32-p4_r3 target (chip_variant esp32p4 = production rev,
; matches the emulator's esp32p4-eco5 silicon). The m5stack-tab5-p4 board targets
; chip_variant esp32p4_es (engineering sample) which boot-loops under esp-emu —
; the Bruce plan's risk R-B (silicon-rev mismatch), now reproduced. The real Tab5
; host build keeps m5stack-tab5-p4 (matches Josh's actual ES hardware).
[env:tab5-smoke]
platform = espressif32
board = esp32-p4_r3
framework = arduino
build_flags =
    -std=gnu++17
    -DDIVLINK_ON_TARGET
lib_deps = symlink://${PROJECT_DIR}/../divlink
monitor_speed = 115200
